# Gradle JVM settings. 2 GB is plenty for a module this size.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX replaces the long-dead com.android.support libraries.
android.useAndroidX=true

# Each module gets only its own R fields, which keeps the dex smaller and makes
# resource references unambiguous.
android.nonTransitiveRClass=true
